<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asistencia — Misael Kids</title>
  <link rel="stylesheet" href="/static/css/variables.css">
  <link rel="stylesheet" href="/static/css/base.css">
  <style>
    .nino-card {
      background:var(--blanco);border:2px solid var(--gris-100);border-radius:var(--radio-xl);
      padding:var(--gap-md);display:flex;align-items:center;gap:var(--gap-md);
      transition:all var(--trans-fast);position:relative;
    }
    .nino-card.presente  { border-color:var(--verde);   background:var(--verde-l); }
    .nino-card.ausente   { border-color:var(--coral);   background:var(--coral-l); }
    .nino-card.justificado { border-color:var(--amarillo);background:var(--amarillo-l); }
    .nino-avatar-as {
      width:46px;height:46px;border-radius:50%;
      background:linear-gradient(135deg,var(--turquesa),var(--verde));
      display:flex;align-items:center;justify-content:center;
      color:white;font-weight:800;font-size:var(--text-base);flex-shrink:0;
    }
    .nino-card-info { flex:1;min-width:0; }
    .nino-card-nombre { font-weight:800;font-size:var(--text-sm);color:var(--texto);
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
    .nino-card-meta   { font-size:var(--text-xs);color:var(--texto-suave);font-weight:600; }
    .estado-btns { display:flex;gap:6px; }
    .estado-btn {
      width:36px;height:36px;border-radius:50%;border:2px solid transparent;
      background:var(--gris-100);cursor:pointer;font-size:1rem;
      display:flex;align-items:center;justify-content:center;transition:all var(--trans-fast);
    }
    .estado-btn:hover { transform:scale(1.15); }
    .estado-btn.sel-presente   { background:var(--verde);   border-color:var(--verde-d);   box-shadow:0 3px 10px rgba(107,203,119,.5); }
    .estado-btn.sel-ausente    { background:var(--coral);   border-color:var(--coral-d);   box-shadow:0 3px 10px rgba(255,107,107,.5); }
    .estado-btn.sel-justificado{ background:var(--amarillo);border-color:var(--amarillo-d);box-shadow:0 3px 10px rgba(255,217,61,.5); }
    .hora-input {
      padding:.3rem .6rem;border:2px solid var(--gris-200);border-radius:var(--radio-md);
      font-size:var(--text-xs);font-family:var(--font-body);font-weight:700;
      color:var(--texto);width:88px;
    }
    .hora-input:focus { outline:none;border-color:var(--turquesa); }
    .ninos-grid { display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:var(--gap-md); }
    .resumen-chip {
      display:flex;align-items:center;gap:var(--gap-sm);
      background:var(--blanco);border-radius:var(--radio-full);
      padding:.5rem var(--gap-md);font-weight:700;font-size:var(--text-sm);
      box-shadow:var(--sombra-sm);border:1.5px solid var(--gris-100);
    }
    .resumen-chip .num { font-family:var(--font-display);font-size:var(--text-xl); }
    .toolbar-masivo {
      background:linear-gradient(135deg,var(--turquesa-l),#E0FFF4);
      border:2px solid var(--turquesa);border-radius:var(--radio-xl);
      padding:var(--gap-md) var(--gap-lg);display:flex;align-items:center;
      gap:var(--gap-md);margin-bottom:var(--gap-md);flex-wrap:wrap;
    }
  </style>
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main-content">
    <header class="topbar">
      <div style="display:flex;align-items:center;gap:var(--gap-md)">
        <h1 class="topbar-titulo">📋 Asistencia</h1>
      </div>
      <div class="topbar-acciones">
        <span id="fecha-display" style="font-weight:700;color:var(--texto-suave);font-size:var(--text-sm)"></span>
        <button class="btn btn-primary" onclick="guardarTodo()" id="btn-guardar">💾 Guardar todo</button>
      </div>
    </header>
    <div class="pagina">

      <!-- Filtros -->
      <div style="display:flex;gap:var(--gap-md);flex-wrap:wrap;margin-bottom:var(--gap-lg);
        background:var(--blanco);padding:var(--gap-lg);border-radius:var(--radio-xl);
        box-shadow:var(--sombra-sm);border:1.5px solid var(--gris-100)">
        <div class="form-grupo" style="margin:0;min-width:160px">
          <label class="form-label">📅 Fecha</label>
          <input type="date" id="f-fecha" class="form-input">
        </div>
        <div class="form-grupo" style="margin:0;min-width:180px">
          <label class="form-label">Sucursal</label>
          <select id="f-sucursal" class="form-select" onchange="cargarSalasF()">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="form-grupo" style="margin:0;min-width:180px">
          <label class="form-label">Sala</label>
          <select id="f-sala" class="form-select" onchange="cargarTurnosF()">
            <option value="">Todas</option>
          </select>
        </div>
        <div class="form-grupo" style="margin:0;min-width:160px">
          <label class="form-label">Turno</label>
          <select id="f-turno" class="form-select">
            <option value="">Todos</option>
          </select>
        </div>
        <div style="display:flex;align-items:flex-end;gap:6px">
          <button class="btn btn-primary" onclick="cargarAsistencia()">Cargar</button>
          <button class="btn btn-outline" onclick="exportarCSV()">📥 CSV</button>
        </div>
      </div>

      <!-- Resumen -->
      <div id="resumen-dia" style="display:none;flex-wrap:wrap;gap:var(--gap-md);margin-bottom:var(--gap-md)">
        <div class="resumen-chip"><span>👶</span><span class="num" id="res-total">0</span><span>Total</span></div>
        <div class="resumen-chip" style="border-color:var(--verde)">
          <span>✅</span><span class="num" id="res-presentes" style="color:var(--verde-d)">0</span><span>Presentes</span>
        </div>
        <div class="resumen-chip" style="border-color:var(--coral)">
          <span>❌</span><span class="num" id="res-ausentes" style="color:var(--coral-d)">0</span><span>Ausentes</span>
        </div>
        <div class="resumen-chip" style="border-color:var(--amarillo)">
          <span>📄</span><span class="num" id="res-justif" style="color:var(--amarillo-d)">0</span><span>Justificados</span>
        </div>
        <div class="resumen-chip" style="border-color:var(--gris-300)">
          <span>⭕</span><span class="num" id="res-sin" style="color:var(--gris-500)">0</span><span>Sin marcar</span>
        </div>
      </div>

      <!-- Toolbar masivo -->
      <div class="toolbar-masivo" id="toolbar-masivo" style="display:none">
        <p style="font-weight:700;font-size:var(--text-sm);color:var(--turquesa-d)">Marcar todos como:</p>
        <button class="btn btn-sm" style="background:var(--verde);color:white"
          onclick="marcarTodos('presente')">✅ Todos presentes</button>
        <button class="btn btn-sm btn-coral" onclick="marcarTodos('ausente')">❌ Todos ausentes</button>
        <div style="flex:1"></div>
        <span style="font-size:var(--text-xs);color:var(--turquesa-d);font-weight:700" id="toolbar-info"></span>
      </div>

      <!-- Grid de niños -->
      <div class="ninos-grid" id="ninos-grid">
        <div style="grid-column:1/-1" class="loader">
          <div style="font-size:2.5rem;margin-bottom:var(--gap-md)">📋</div>
          <p style="color:var(--texto-suave);font-weight:600">Selecciona una sala y fecha para cargar la asistencia</p>
        </div>
      </div>

      <!-- Historial -->
      <div class="card mt-lg" id="card-historial" style="display:none">
        <div class="card-header">
          <h3 class="card-titulo">📅 Historial de asistencia</h3>
          <button class="btn btn-outline btn-sm" onclick="document.getElementById('card-historial').style.display='none'">✕</button>
        </div>
        <div class="tabla-wrap">
          <table>
            <thead><tr><th>Niño/a</th><th>Fecha</th><th>Estado</th><th>Entrada</th><th>Salida</th><th>Motivo</th><th>Acciones</th></tr></thead>
            <tbody id="tbody-historial"></tbody>
          </table>
        </div>
      </div>

    </div>
  </main>
</div>

<!-- Modal detalle de asistencia individual -->
<div class="modal-overlay" id="modal-detalle-asist">
  <div class="modal">
    <div class="modal-header">
      <h3 class="modal-titulo" id="titulo-modal-asist">Detalle de asistencia</h3>
      <button class="modal-cerrar">✕</button>
    </div>
    <input type="hidden" id="da-inscripcion-id">
    <input type="hidden" id="da-asistencia-id">
    <div class="grid-2">
      <div class="form-grupo">
        <label class="form-label">Estado</label>
        <select id="da-estado" class="form-select">
          <option value="presente">✅ Presente</option>
          <option value="ausente">❌ Ausente</option>
          <option value="ausente_justificado">📄 Ausente justificado</option>
        </select>
      </div>
      <div class="form-grupo">
        <label class="form-label">Fecha</label>
        <input type="date" id="da-fecha" class="form-input" disabled>
      </div>
      <div class="form-grupo">
        <label class="form-label">Quién entregó al niño</label>
        <input type="text" id="da-entregado" class="form-input" placeholder="Nombre de quien trajo al niño">
      </div>
      <div class="form-grupo">
        <label class="form-label">Hora de entrada</label>
        <input type="time" id="da-hora-entrada" class="form-input">
      </div>
      <div class="form-grupo">
        <label class="form-label">Quién retiró al niño</label>
        <input type="text" id="da-retirado" class="form-input" placeholder="Nombre de quien retiró">
      </div>
      <div class="form-grupo">
        <label class="form-label">Hora de salida</label>
        <input type="time" id="da-hora-salida" class="form-input">
      </div>
      <div class="form-grupo">
        <label class="form-label">¿Retiro autorizado?</label>
        <select id="da-autorizado" class="form-select">
          <option value="true">✅ Sí, estaba autorizado</option>
          <option value="false">⚠️ No estaba en la lista</option>
        </select>
      </div>
      <div class="form-grupo" id="campo-motivo-ausencia">
        <label class="form-label">Motivo de ausencia</label>
        <input type="text" id="da-motivo" class="form-input" placeholder="Ej: Enfermedad, viaje...">
      </div>
    </div>
    <div class="form-grupo">
      <label class="form-label">Observación de entrada</label>
      <textarea id="da-obs-entrada" class="form-textarea" style="min-height:55px"
        placeholder="Estado del niño al llegar..."></textarea>
    </div>
    <div style="display:flex;gap:var(--gap-sm);justify-content:flex-end;margin-top:var(--gap-md)">
      <button class="btn btn-outline" onclick="UI.cerrarModal('modal-detalle-asist')">Cancelar</button>
      <button class="btn btn-primary" onclick="guardarDetalleModal()">💾 Guardar</button>
    </div>
  </div>
</div>

<script src="/static/js/api.js"></script>
<script src="/static/js/components.js"></script>
<script>
initPanel('asistencia');

const hoyDate = new Date();
const hoyISO  = hoyDate.toISOString().split('T')[0];
const ahoraT  = hoyDate.toTimeString().slice(0,5);
document.getElementById('f-fecha').value = hoyISO;
document.getElementById('fecha-display').textContent = hoyDate.toLocaleDateString('es-BO',{
  weekday:'long',day:'numeric',month:'long'
});

let registros = {};
let ninosCargados = [];
let asistenciasExistentes = {};

async function inicializar() {
  await cargarSelectores();
}

async function cargarSelectores() {
  try {
    const data = await API.get('/core/sucursales/?activa=true');
    UI.llenarSelect(document.getElementById('f-sucursal'), data.results||data, 'id', 'nombre');
    if ((data.results||data).length===1) {
      document.getElementById('f-sucursal').value = (data.results||data)[0].id;
      await cargarSalasF();
    }
  } catch {}
}

async function cargarSalasF() {
  const sucId = document.getElementById('f-sucursal').value;
  const sel   = document.getElementById('f-sala');
  sel.innerHTML = '<option value="">Todas las salas</option>';
  document.getElementById('f-turno').innerHTML = '<option value="">Todos los turnos</option>';
  if (!sucId) return;
  try {
    const data = await API.get('/core/salas/?sucursal='+sucId+'&activa=true');
    UI.llenarSelect(sel, data.results||data, 'id', s=>s.nombre+' ('+s.rango_edad+')');
  } catch {}
}

async function cargarTurnosF() {
  const salaId = document.getElementById('f-sala').value;
  const sel    = document.getElementById('f-turno');
  sel.innerHTML = '<option value="">Todos los turnos</option>';
  if (!salaId) return;
  try {
    const data = await API.get('/core/turnos/?sala='+salaId+'&activo=true');
    UI.llenarSelect(sel, data.results||data, 'id', t=>t.nombre+' ('+t.hora_inicio?.slice(0,5)+'-'+t.hora_fin?.slice(0,5)+')');
  } catch {}
}

async function cargarAsistencia() {
  const fecha   = document.getElementById('f-fecha').value;
  const sucId   = document.getElementById('f-sucursal').value;
  const salaId  = document.getElementById('f-sala').value;
  const turnoId = document.getElementById('f-turno').value;
  if (!salaId && !sucId) { UI.toast('Selecciona al menos una sucursal o sala','warn'); return; }
  const grid = document.getElementById('ninos-grid');
  UI.mostrarLoader(grid,'Cargando niños inscritos...');
  try {
    let urlInsc = '/inscripciones/inscripciones/?activa=true&page_size=200';
    if (salaId)  urlInsc += '&sala='+salaId;
    if (turnoId) urlInsc += '&turno='+turnoId;
    if (sucId)   urlInsc += '&sucursal='+sucId;
    const insc = await API.get(urlInsc);
    ninosCargados = insc.results||insc;

    let urlAsist = '/asistencia/asistencia/?fecha='+fecha+'&page_size=500';
    if (salaId) urlAsist += '&inscripcion__sala='+salaId;
    const asistResp = await API.get(urlAsist);
    const listaAsist = asistResp.results||asistResp;
    asistenciasExistentes = {};
    listaAsist.forEach(a => { asistenciasExistentes[a.inscripcion] = a; });

    registros = {};
    ninosCargados.forEach(i => {
      const ex = asistenciasExistentes[i.id];
      registros[i.id] = {
        inscripcion: i.id, nino_nombre: i.nino_nombre,
        sala_nombre: i.sala_nombre, turno_nombre: i.turno_nombre,
        fecha, estado: ex?.estado||null,
        hora_entrada: ex?.hora_entrada?.slice(0,5)||'',
        hora_salida:  ex?.hora_salida?.slice(0,5)||'',
        entregado_por:ex?.entregado_por||'',
        retirado_por: ex?.retirado_por||'',
        retiro_autorizado: ex?.retiro_autorizado!==false,
        obs_entrada:  ex?.obs_entrada||'',
        motivo_ausencia:ex?.motivo_ausencia||'',
        asistencia_id:ex?.id||null,
      };
    });
    renderGrid();
  } catch (err) {
    UI.vacio(grid,'Error: '+err.message,'⚠️');
  }
}

function renderGrid() {
  const grid = document.getElementById('ninos-grid');
  const lista = Object.values(registros);
  if (!lista.length) { UI.vacio(grid,'No hay niños inscritos con esos filtros','👶'); actualizarResumen(); return; }
  document.getElementById('resumen-dia').style.display   = 'flex';
  document.getElementById('toolbar-masivo').style.display = 'flex';
  actualizarResumen();
  grid.innerHTML = lista.map(r => {
    const claseCard = r.estado==='presente'?'presente':r.estado==='ausente'?'ausente':r.estado==='ausente_justificado'?'justificado':'';
    return `
      <div class="nino-card ${claseCard}" id="card-${r.inscripcion}">
        <div class="nino-avatar-as">${UI.iniciales(r.nino_nombre)}</div>
        <div class="nino-card-info">
          <div class="nino-card-nombre">${r.nino_nombre}</div>
          <div class="nino-card-meta">${r.sala_nombre} · ${r.turno_nombre}</div>
          <div style="display:flex;gap:5px;margin-top:5px;align-items:center">
            <input type="time" class="hora-input" value="${r.hora_entrada||ahoraT}"
              title="Hora de entrada"
              onchange="registros['${r.inscripcion}'].hora_entrada=this.value">
            <span style="color:var(--gris-400);font-size:.75rem">→</span>
            <input type="time" class="hora-input" value="${r.hora_salida}"
              title="Hora de salida"
              onchange="registros['${r.inscripcion}'].hora_salida=this.value">
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;align-items:center">
          <div class="estado-btns">
            <button class="estado-btn ${r.estado==='presente'?'sel-presente':''}" title="Presente"
              onclick="setEstado('${r.inscripcion}','presente')">✅</button>
            <button class="estado-btn ${r.estado==='ausente'?'sel-ausente':''}" title="Ausente"
              onclick="setEstado('${r.inscripcion}','ausente')">❌</button>
            <button class="estado-btn ${r.estado==='ausente_justificado'?'sel-justificado':''}" title="Justificado"
              onclick="setEstado('${r.inscripcion}','ausente_justificado')">📄</button>
            <button class="estado-btn" title="Editar detalle"
              onclick="abrirDetalle('${r.inscripcion}')">✏️</button>
          </div>
          ${r.asistencia_id
            ?'<span class="chip chip-turquesa" style="font-size:.6rem">✓ Guardado</span>'
            :'<span class="chip chip-gris" style="font-size:.6rem">Sin guardar</span>'}
          ${r.retiro_autorizado===false?'<span class="chip chip-coral" style="font-size:.6rem">⚠️ Retiro no autorizado</span>':''}
        </div>
      </div>`;
  }).join('');
}

function setEstado(inscId, estado) {
  registros[inscId].estado = estado;
  if (estado==='presente' && !registros[inscId].hora_entrada)
    registros[inscId].hora_entrada = ahoraT;
  renderGrid();
}

function marcarTodos(estado) {
  Object.keys(registros).forEach(id => {
    registros[id].estado = estado;
    if (estado==='presente' && !registros[id].hora_entrada) registros[id].hora_entrada = ahoraT;
  });
  renderGrid();
  UI.toast('Todos marcados como '+estado,'info');
}

function actualizarResumen() {
  const lista = Object.values(registros);
  document.getElementById('res-total').textContent    = lista.length;
  document.getElementById('res-presentes').textContent= lista.filter(r=>r.estado==='presente').length;
  document.getElementById('res-ausentes').textContent = lista.filter(r=>r.estado==='ausente').length;
  document.getElementById('res-justif').textContent   = lista.filter(r=>r.estado==='ausente_justificado').length;
  document.getElementById('res-sin').textContent      = lista.filter(r=>!r.estado).length;
  document.getElementById('toolbar-info').textContent = lista.length+' niños cargados';
}

async function guardarTodo() {
  const sinEstado = Object.values(registros).filter(r=>!r.estado);
  if (sinEstado.length) { UI.toast(sinEstado.length+' niño(s) sin estado asignado','warn'); return; }
  const btn = document.getElementById('btn-guardar');
  btn.disabled=true; btn.textContent='⏳ Guardando...';
  let ok=0, err=0;
  for (const r of Object.values(registros)) {
    try {
      const payload = {
        inscripcion:r.inscripcion, fecha:r.fecha, estado:r.estado,
        hora_entrada:r.hora_entrada||null, hora_salida:r.hora_salida||null,
        entregado_por:r.entregado_por||'', retirado_por:r.retirado_por||'',
        retiro_autorizado:r.retiro_autorizado,
        obs_entrada:r.obs_entrada||'', motivo_ausencia:r.motivo_ausencia||'',
      };
      if (r.asistencia_id) {
        await API.patch('/asistencia/asistencia/'+r.asistencia_id+'/',payload);
      } else {
        const nuevo = await API.post('/asistencia/asistencia/',payload);
        registros[r.inscripcion].asistencia_id = nuevo.id;
      }
      ok++;
    } catch { err++; }
  }
  btn.disabled=false; btn.textContent='💾 Guardar todo';
  if (err===0) { UI.toast('✅ '+ok+' registros guardados correctamente','exito'); renderGrid(); }
  else         { UI.toast('⚠️ '+ok+' guardados, '+err+' con error','warn'); }
}

// ── Modal detalle ──
function abrirDetalle(inscId) {
  const r = registros[inscId];
  document.getElementById('titulo-modal-asist').textContent = r.nino_nombre;
  document.getElementById('da-inscripcion-id').value = inscId;
  document.getElementById('da-asistencia-id').value  = r.asistencia_id||'';
  document.getElementById('da-estado').value      = r.estado||'presente';
  document.getElementById('da-fecha').value        = r.fecha;
  document.getElementById('da-entregado').value    = r.entregado_por||'';
  document.getElementById('da-hora-entrada').value = r.hora_entrada||ahoraT;
  document.getElementById('da-retirado').value     = r.retirado_por||'';
  document.getElementById('da-hora-salida').value  = r.hora_salida||'';
  document.getElementById('da-autorizado').value   = r.retiro_autorizado?'true':'false';
  document.getElementById('da-motivo').value       = r.motivo_ausencia||'';
  document.getElementById('da-obs-entrada').value  = r.obs_entrada||'';
  UI.abrirModal('modal-detalle-asist');
}

function guardarDetalleModal() {
  const inscId = document.getElementById('da-inscripcion-id').value;
  registros[inscId].estado           = document.getElementById('da-estado').value;
  registros[inscId].entregado_por    = document.getElementById('da-entregado').value;
  registros[inscId].hora_entrada     = document.getElementById('da-hora-entrada').value;
  registros[inscId].retirado_por     = document.getElementById('da-retirado').value;
  registros[inscId].hora_salida      = document.getElementById('da-hora-salida').value;
  registros[inscId].retiro_autorizado= document.getElementById('da-autorizado').value==='true';
  registros[inscId].motivo_ausencia  = document.getElementById('da-motivo').value;
  registros[inscId].obs_entrada      = document.getElementById('da-obs-entrada').value;
  UI.cerrarModal('modal-detalle-asist');
  renderGrid();
  UI.toast('Detalle actualizado (recuerda guardar todo)','info');
}

// ── Exportar CSV ──
function exportarCSV() {
  const lista = Object.values(registros);
  if (!lista.length) { UI.toast('No hay datos para exportar','warn'); return; }
  const filas = [
    ['Niño','Sala','Turno','Fecha','Estado','Entrada','Salida','Entregado por','Retirado por','Autorizado'].join(','),
    ...lista.map(r=>[
      '"'+r.nino_nombre+'"','"'+r.sala_nombre+'"','"'+r.turno_nombre+'"',
      r.fecha, r.estado||'sin_marcar', r.hora_entrada||'', r.hora_salida||'',
      '"'+r.entregado_por+'"','"'+r.retirado_por+'"', r.retiro_autorizado?'Si':'No'
    ].join(','))
  ];
  const BOM  = '\uFEFF';
  const blob = new Blob([BOM+filas.join('\n')],{type:'text/csv;charset=utf-8;'});
  const url  = URL.createObjectURL(blob);
  Object.assign(document.createElement('a'),{href:url,download:'asistencia_'+document.getElementById('f-fecha').value+'.csv'}).click();
  URL.revokeObjectURL(url);
}

inicializar();
</script>
